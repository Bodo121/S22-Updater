name: Release Build

# Publishes S22-Updater releases that the app's own "Check for app updates"
# installs. Push a tag like v4.0 (must match android:versionName), or run
# manually and let the workflow create the tag from the manifest.
#
# Signing: for seamless in-app updates the release APK MUST use the same
# keystore as the installed app. Add these repository secrets once:
#   ANDROID_KEYSTORE_BASE64  base64 of your release/debug keystore file
#   SIGN_STORE_PASS          keystore password
#   SIGN_KEY_PASS            key password
#   SIGN_ALIAS               key alias
#   SIGN_EXPECTED_CERT_SHA256 optional override for release certificate SHA-256 digest
# The current v2 key starts a clean signing line; no lineage file is attached.
# Missing signing secrets fail the workflow before publication.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish (blank = v<manifest versionName>)
        required: false
        type: string

permissions:
  contents: write

env:
  RELEASE_CERT_SHA256: 6ba56772f7e69a226a983f8d06849602caae2c3d58a22717b35ccc6ff39712b7

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          VERSION_NAME="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*android:versionCode="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -n 1)"
          EXPECTED_TAG="v$VERSION_NAME"
          if [ -n "$INPUT_TAG_NAME" ]; then
            TAG_NAME="$INPUT_TAG_NAME"
          else
            TAG_NAME="$EXPECTED_TAG"
          fi
          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $TAG_NAME does not match manifest $VERSION_NAME (expected $EXPECTED_TAG)." >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "refs/tags/$TAG_NAME"
          fi
          {
            echo "tag_name=$TAG_NAME"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "tag_commit=$(git rev-list -n 1 "$TAG_NAME")"
            echo "previous_tag=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          git checkout --force "$TAG_NAME"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SIGN_STORE_PASS }}
          KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.SIGN_ALIAS }}
          EXPECTED_CERT: ${{ secrets.SIGN_EXPECTED_CERT_SHA256 || env.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASS KEY_PASS KEY_ALIAS EXPECTED_CERT; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "missing signing secret $name; refusing to publish production release" >&2
              exit 1
            fi
          done
          if ! printf '%s' "$EXPECTED_CERT" | grep -Eq '^[A-Fa-f0-9]{64}$'; then
            echo "SIGN_EXPECTED_CERT_SHA256 must be a 64-character SHA-256 digest" >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          echo "SIGN_KEYSTORE=$PWD/release.keystore" >> "$GITHUB_ENV"
          echo "using repository signing key"

      - name: Build legacy APK (backend verification only)
        env:
          BT: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
          PLATFORM: ${{ env.ANDROID_HOME }}/platforms/android-34/android.jar
          SIGN_STORE_PASS: ${{ secrets.SIGN_STORE_PASS }}
          SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
          SIGN_ALIAS: ${{ secrets.SIGN_ALIAS }}
          SIGN_EXPECTED_CERT_SHA256: ${{ secrets.SIGN_EXPECTED_CERT_SHA256 || env.RELEASE_CERT_SHA256 }}
        run: bash build.sh

      - name: Host tests
        env:
          BT: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
          PLATFORM: ${{ env.ANDROID_HOME }}/platforms/android-34/android.jar
        run: bash tests/check.sh

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: React Native checks and bundle
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- --runInBand
          npm run bundle

      - name: Build React Native release APK
        env:
          SIGN_KEYSTORE: ${{ env.SIGN_KEYSTORE }}
          SIGN_STORE_PASS: ${{ secrets.SIGN_STORE_PASS }}
          SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
          SIGN_ALIAS: ${{ secrets.SIGN_ALIAS }}
          EXPECTED_CERT: ${{ secrets.SIGN_EXPECTED_CERT_SHA256 || env.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon --max-workers=2 :app:assembleRelease)
          RN_APK=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$RN_APK" ] || { echo "React Native release APK missing" >&2; exit 1; }
          CERT_REPORT="$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$RN_APK")"
          printf '%s\n' "$CERT_REPORT"
          printf '%s\n' "$CERT_REPORT" | grep -qi "$EXPECTED_CERT" \
            || { echo "RN APK signer does not match expected release certificate" >&2; exit 1; }
          VERSION_NAME="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -n 1)"
          rm -f out/S22-Updater-v*.apk
          cp "$RN_APK" "out/S22-Updater-v$VERSION_NAME.apk"

      - name: Generate release files
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
          VERSION_NAME: ${{ steps.release_tag.outputs.version_name }}
          VERSION_CODE: ${{ steps.release_tag.outputs.version_code }}
          TAG_COMMIT: ${{ steps.release_tag.outputs.tag_commit }}
          PREVIOUS_TAG: ${{ steps.release_tag.outputs.previous_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          APK=(out/S22-Updater-v*.apk)
          [ "${#APK[@]}" -eq 1 ] || { echo "expected one APK in out/" >&2; exit 1; }
          APK_NAME="$(basename "${APK[0]}")"
          (cd out && sha256sum "$APK_NAME" > SHA256SUMS)
          SHA="$(cut -d' ' -f1 "out/SHA256SUMS")"
          cat > "out/app-update.json" <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "tag": "$TAG_NAME",
            "apk": "$APK_NAME",
            "apkUrl": "https://github.com/Bodo121/S22-Updater/releases/download/$TAG_NAME/$APK_NAME",
            "sha256": "$SHA"
          }
          EOF
          {
            echo "# Release $TAG_NAME"
            echo
            echo "Version: $VERSION_NAME (code $VERSION_CODE)"
            echo "Commit: $TAG_COMMIT"
            echo "APK: $APK_NAME"
            echo "SHA-256: $SHA"
            echo
            echo "> Signed with the v2 release key. Builds on older keys need a one-time uninstall first; the app's updater detects this and guides you."
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since $PREVIOUS_TAG:"
              echo
              git log --format='- %s' "$PREVIOUS_TAG..$TAG_NAME"
            else
              echo "First tagged release."
            fi
          } > release-notes.md

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
            gh release upload "$TAG_NAME" out/S22-Updater-v*.apk out/SHA256SUMS out/app-update.json --clobber
          else
            gh release create "$TAG_NAME" out/S22-Updater-v*.apk out/SHA256SUMS out/app-update.json \
              --title "Release $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          fi
