name: Release Build

# Publishes S22-Updater releases that the app's own "Check for app updates"
# installs. Push a tag like v4.0 (must match android:versionName), or run
# manually and let the workflow create the tag from the manifest.
#
# Signing: for seamless in-app updates the release APK MUST use the same
# keystore as the installed app. Add these repository secrets once:
#   ANDROID_KEYSTORE_BASE64  base64 of your release/debug keystore file
#   SIGN_STORE_PASS          keystore password
#   SIGN_KEY_PASS            key password
#   SIGN_ALIAS               key alias
# The current v2 key starts a clean signing line; no lineage file is attached.
# Without secrets the workflow signs with a throwaway debug key and marks the
# release notes accordingly (that APK cannot update an existing install).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish (blank = v<manifest versionName>)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          VERSION_NAME="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*android:versionCode="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -n 1)"
          EXPECTED_TAG="v$VERSION_NAME"
          if [ -n "$INPUT_TAG_NAME" ]; then
            TAG_NAME="$INPUT_TAG_NAME"
          else
            TAG_NAME="$EXPECTED_TAG"
          fi
          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $TAG_NAME does not match manifest $VERSION_NAME (expected $EXPECTED_TAG)." >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "refs/tags/$TAG_NAME"
          fi
          {
            echo "tag_name=$TAG_NAME"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "tag_commit=$(git rev-list -n 1 "$TAG_NAME")"
            echo "previous_tag=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          git checkout --force "$TAG_NAME"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "SIGN_KEYSTORE=$PWD/release.keystore" >> "$GITHUB_ENV"
            echo "using repository signing key"
          else
            echo "no signing secrets; using a throwaway debug key"
          fi

      - name: Build APK
        env:
          BT: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
          PLATFORM: ${{ env.ANDROID_HOME }}/platforms/android-34/android.jar
          SIGN_STORE_PASS: ${{ secrets.SIGN_STORE_PASS }}
          SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
          SIGN_ALIAS: ${{ secrets.SIGN_ALIAS }}
        run: bash build.sh

      - name: Host tests
        env:
          BT: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
          PLATFORM: ${{ env.ANDROID_HOME }}/platforms/android-34/android.jar
        run: bash tests/check.sh

      - name: Generate release files
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
          VERSION_NAME: ${{ steps.release_tag.outputs.version_name }}
          VERSION_CODE: ${{ steps.release_tag.outputs.version_code }}
          TAG_COMMIT: ${{ steps.release_tag.outputs.tag_commit }}
          PREVIOUS_TAG: ${{ steps.release_tag.outputs.previous_tag }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          APK=(out/S22-Updater-v*.apk)
          [ "${#APK[@]}" -eq 1 ] || { echo "expected one APK in out/" >&2; exit 1; }
          APK_NAME="$(basename "${APK[0]}")"
          (cd out && sha256sum "$APK_NAME" > SHA256SUMS)
          SHA="$(cut -d' ' -f1 "out/SHA256SUMS")"
          cat > "out/app-update.json" <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "tag": "$TAG_NAME",
            "apk": "$APK_NAME",
            "apkUrl": "https://github.com/Bodo121/S22-Updater/releases/download/$TAG_NAME/$APK_NAME",
            "sha256": "$SHA"
          }
          EOF
          {
            echo "# Release $TAG_NAME"
            echo
            echo "Version: $VERSION_NAME (code $VERSION_CODE)"
            echo "Commit: $TAG_COMMIT"
            echo "APK: $APK_NAME"
            echo "SHA-256: $SHA"
            echo
            if [ -z "$KEYSTORE_B64" ]; then
              echo "> Signed with a throwaway debug key: this APK installs fresh but cannot update an existing install. Add the signing secrets and re-run for an updatable release."
              echo
            else
              echo "> Signed with the v2 release key. Builds on older keys need a one-time uninstall first; the app's updater detects this and guides you."
              echo
            fi
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since $PREVIOUS_TAG:"
              echo
              git log --format='- %s' "$PREVIOUS_TAG..$TAG_NAME"
            else
              echo "First tagged release."
            fi
          } > release-notes.md

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
            gh release upload "$TAG_NAME" out/S22-Updater-v*.apk out/SHA256SUMS out/app-update.json --clobber
          else
            gh release create "$TAG_NAME" out/S22-Updater-v*.apk out/SHA256SUMS out/app-update.json \
              --title "Release $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          fi
